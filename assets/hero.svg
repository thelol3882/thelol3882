    @keyframes gb { 0%, 90%, 100% { transform: none; } 91% { transform: translate(5px,-1px); } 94% { transform: translate(-3px,2px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; } .band { animation: none; }
      .timer { animation: none; transform: scaleX(.22); } .ga, .gb, .blink { animation: none; }
    }
