<svg xmlns="http://www.w3.org/2000/svg" width="820" height="384" viewBox="0 0 820 384">
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern></defs>
  <style>
    text { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d8d8e0; white-space: pre; }
    .l { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ga { animation: ga 6s steps(1) infinite; } .gb { animation: gb 6s steps(1) infinite; }
    .ga, .gb { animation-delay: -6.3s; }
    @keyframes ga { 0%, 93%, 100% { transform: none; } 94% { transform: translate(-4px,1px); } 96% { transform: translate(2px,-1px); } }
    @keyframes gb { 0%, 93%, 100% { transform: none; } 94% { transform: translate(4px,-1px); } 96% { transform: translate(-2px,1px); } }
    @media (prefers-reduced-motion: reduce) { .ga, .gb, .l, .cur { animation: none !important; opacity: 1; } }
  </style>
  <path d="M1 1 H795 L819 25 V383 H25 L1 359 Z" fill="#0a0a12" stroke="#5ef6ff" stroke-opacity=".55"/>
  <path d="M1 1 H795 L819 25 V383 H25 L1 359 Z" fill="url(#scan)"/>
  <path d="M1 36 H819" stroke="#5ef6ff" stroke-opacity=".3"/>
  <rect x="16" y="14" width="10" height="10" fill="#ff3b5c"/><rect x="32" y="14" width="10" height="10" fill="#f3e600"/><rect x="48" y="14" width="10" height="10" fill="#5ef6ff"/>
  <text x="790" y="24" text-anchor="end" style="font-size:12px; letter-spacing:3px; fill:#6a6a7e">NETRUNNER://DIAS@ASTANA</text>
  <text x="28" y="74" class="l" style="animation-delay:0.90s"><tspan fill="#f3e600">&gt;</tspan> whoami</text>
  <text x="28" y="98" class="l" style="animation-delay:1.25s"><tspan fill="#ff3b5c">dias</tspan><tspan fill="#d8d8e0"> :: backend engineer · go &amp; python</tspan></text>
  <text x="28" y="132" class="l" style="animation-delay:1.85s"><tspan fill="#f3e600">&gt;</tspan> cat ./mission.txt</text>
  <text x="28" y="156" class="l" style="animation-delay:2.20s"><tspan fill="#d8d8e0">build &amp; run production web platforms, end-to-end</tspan></text>
  <text x="28" y="190" class="l" style="animation-delay:2.80s"><tspan fill="#f3e600">&gt;</tspan> ls ~/quickhacks</text>
  <text x="28" y="214" class="l" style="animation-delay:3.15s"><tspan fill="#5ef6ff">luxen/  </tspan><tspan fill="#6a6a7e"># release &amp; deploy CLI</tspan></text>
  <text x="28" y="238" class="l" style="animation-delay:3.50s"><tspan fill="#5ef6ff">lexen/  </tspan><tspan fill="#6a6a7e"># i18n extraction, validation &amp; sorting</tspan></text>
  <text x="28" y="262" class="l" style="animation-delay:3.85s"><tspan fill="#5ef6ff">bult/   </tspan><tspan fill="#6a6a7e"># self-healing mini-PaaS (wip)</tspan></text>
  <text x="28" y="296" class="l" style="animation-delay:4.45s"><tspan fill="#f3e600">&gt;</tspan> ping --team backend</text>
  <text x="28" y="320" class="l" style="animation-delay:4.80s"><tspan fill="#f3e600">reply from dias: ready to jack in</tspan></text>
  <g class="l" style="animation-delay:5.30s">
    <text x="28" y="354"><tspan fill="#f3e600">&gt;</tspan></text>
    <rect class="cur" x="46" y="339" width="10" height="19" fill="#5ef6ff"/>
  </g>
</svg>
