<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .sub { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
      .fade { opacity: 0; animation: in 0.8s ease-out forwards; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.6s; } .d3 { animation-delay: 1s; }
      @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .node { fill: #58a6ff; animation: pulse 3s ease-in-out infinite; }
      .n2 { fill: #a371f7; animation-delay: 1s; } .n3 { fill: #3fb950; animation-delay: 2s; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .link { stroke: url(#accent); stroke-width: 2; fill: none; stroke-dasharray: 6 8; animation: flow 2s linear infinite; opacity: 0.7; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .bar { animation: grow 1.2s ease-out 0.4s both; transform-origin: 80px 0; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <circle cx="980" cy="140" r="220" fill="url(#glow)"/>

  <!-- service graph: frontend → api → workers / db -->
  <g>
    <path class="link" d="M860 80 L980 140 L1100 80"/>
    <path class="link" d="M980 140 L980 220"/>
    <path class="link" d="M860 80 L860 200 L980 220"/>
    <path class="link" d="M1100 80 L1100 200 L980 220"/>
    <circle class="node" cx="860" cy="80" r="10"/>
    <circle class="node n2" cx="980" cy="140" r="14"/>
    <circle class="node n3" cx="1100" cy="80" r="10"/>
    <circle class="node" cx="860" cy="200" r="7"/>
    <circle class="node n3" cx="1100" cy="200" r="7"/>
    <circle class="node n2" cx="980" cy="220" r="10"/>
  </g>

  <text class="title fade d1" x="80" y="125">Hi, I'm Dias</text>
  <rect class="bar" x="80" y="148" width="300" height="5" rx="2.5" fill="url(#accent)"/>
  <text class="sub fade d2" x="80" y="195">full-stack developer · backend · frontend · infra</text>
  <text class="sub fade d3" x="80" y="228" style="fill:#58a6ff">python · go · typescript · sql</text>
</svg>
