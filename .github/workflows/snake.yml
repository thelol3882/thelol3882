name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake-raw.svg?color_snake=#f3e600&color_dots=#161620,#3b1420,#6b1c2a,#ff3b5c,#5ef6ff&color_dot_border=#ffffff08&color_background=#0a0a12

      - name: Wrap snake in the cyberpunk frame
        run: |
          mkdir -p dist
          python3 .github/scripts/frame_snake.py snake-raw.svg dist/snake-cyber.svg
          rm snake-raw.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
